name: ocdly

x-app-image: &app-image ocdly-app-dev
x-commerce-image: &commerce-image ocdly-commerce-dev

x-commerce-environment: &commerce-environment
  NODE_ENV: production
  VENDURE_PORT: 3050
  VENDURE_HOST: 0.0.0.0
  VENDURE_CHANNEL_TOKEN: ${VENDURE_CHANNEL_TOKEN:-ocdly-web}
  VENDURE_CORS_ORIGINS: http://localhost:3001
  VENDURE_ASSET_URL: http://localhost:3050/assets/
  DB_HOST: commerce-postgres
  DB_PORT: 5432
  DB_NAME: ocdly_commerce
  DB_SCHEMA: public
  DB_USERNAME: postgres
  DB_PASSWORD: ${COMMERCE_POSTGRES_PASSWORD:-password}
  DB_SSL: "false"
  SUPERADMIN_USERNAME: ${VENDURE_SUPERADMIN_USERNAME:-admin@ocdly.local}
  SUPERADMIN_PASSWORD: ${VENDURE_SUPERADMIN_PASSWORD:-change-me-before-production}
  COOKIE_SECRET: ${VENDURE_COOKIE_SECRET:-local-commerce-cookie-secret-32-characters}
  VENDURE_IDENTITY_SECRET: ${VENDURE_IDENTITY_SECRET:-local-commerce-identity-secret-32-characters}

services:
  web:
    image: *app-image
    init: true
    working_dir: /app/apps/web
    command: ["bun", ".output/server/index.mjs"]
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      SERVER_URL: http://server:3000
      VENDURE_CHANNEL_TOKEN: ${VENDURE_CHANNEL_TOKEN:-ocdly-web}
      VENDURE_SHOP_API_URL: http://commerce:3050/shop-api
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    image: *app-image
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        PUBLIC_API_URL: http://localhost:3000
    init: true
    command: ["bun", "dist/index.mjs"]
    ports:
      - "3000:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-better-auth-secret-change-before-deployment}
      NODE_ENV: development
      OTP_PROVIDER: dev-console
      VENDURE_IDENTITY_SECRET: ${VENDURE_IDENTITY_SECRET:-local-commerce-identity-secret-32-characters}
      VENDURE_CHANNEL_TOKEN: ${VENDURE_CHANNEL_TOKEN:-ocdly-web}
      VENDURE_SHOP_API_URL: http://commerce:3050/shop-api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SERVICE_URL_SERVER: http://localhost:3000
      SERVICE_URL_WEB: http://localhost:3001
    entrypoint: ["/app/apps/server/docker-entrypoint.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      commerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: *app-image
    command: ["bun", "run", "--cwd", "/app/packages/db", "db:migrate:deploy"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    entrypoint: ["/app/apps/server/docker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ocdly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ocdly_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocdly"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  commerce-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ocdly_commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMMERCE_POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - commerce_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocdly_commerce"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  commerce-seed:
    image: *commerce-image
    environment: *commerce-environment
    command: ["./node_modules/.bin/ts-node", "./src/seed.ts"]
    depends_on:
      commerce-postgres:
        condition: service_healthy
    volumes:
      - commerce_assets:/app/apps/commerce/static/assets
    restart: "no"

  commerce:
    image: *commerce-image
    build:
      context: .
      dockerfile: apps/commerce/Dockerfile
    environment: *commerce-environment
    ports:
      - "3050:3050"
    depends_on:
      commerce-seed:
        condition: service_completed_successfully
    volumes:
      - commerce_assets:/app/apps/commerce/static/assets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  commerce-worker:
    image: *commerce-image
    environment: *commerce-environment
    command: ["node", "./dist/index-worker.js"]
    depends_on:
      commerce-seed:
        condition: service_completed_successfully
    volumes:
      - commerce_assets:/app/apps/commerce/static/assets
    restart: unless-stopped

volumes:
  ocdly_postgres_data:
  commerce_postgres_data:
  commerce_assets:
